<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: rgb(246, 214, 172);
        }
    </style>
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h6>Curso de HTML5 - Módulo 1 do Curso em Video</h6>
    <h1>Inserindo hospedados localmente.</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>
    <video width="560" poster="midia/limoes-capa.png" controls autoplay loop>
        <source src="midia/Meu-Video.ogv" type="video/ogv">
        <source src="midia/Meu-Video.mp4" type="video/mp4">
        <source src="midia/Meu-Video.webm" type="video/webm">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>
    </video>
     <!-- Essa seria a forma mais simples mas não a melhor, caso colocando varios formatos de videos
    <video src="midia/Meu-Video.ogv" width="500" controls></video>
     -->
    <h1>Inserindo vídeos do YouTube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/21mDekTZwsw?si=ja9phBPYaW9YzcCl" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
